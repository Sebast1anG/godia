name: Sync to GitLab

on:
  push:
    branches: ['**']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.SYNCHRO_TOKEN }}
        run: |
          git config --global http."https://gitlab.com/".extraHeader "Authorization: Bearer ${GITLAB_TOKEN}"
          git remote add gitlab https://gitlab.com/Char0n/godia.git
          git push gitlab --all --force
          git push gitlab --tags --force
